<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #070b14;
            --surface: rgba(17, 24, 39, 0.72);
            --surface-solid: #111827;
            --surface-elevated: rgba(30, 41, 59, 0.65);
            --border-subtle: rgba(148, 163, 184, 0.14);
            --border-hover: rgba(129, 140, 248, 0.45);
            --accent-1: #6366f1;
            --accent-2: #06b6d4;
            --accent-3: #8b5cf6;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.13);
            --danger: #f43f5e;
            --danger-bg: rgba(244, 63, 94, 0.13);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 36px 16px 80px;
            overflow-x: hidden;
            position: relative;
            line-height: 1.65;
        }

        /* Subtle Ambient Mesh & Dot Grid Background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(148, 163, 184, 0.12) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(110px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
            animation: drift 16s infinite alternate ease-in-out;
        }
        .orb-a {
            width: 460px;
            height: 460px;
            background: radial-gradient(circle, var(--accent-1), transparent 70%);
            top: -120px;
            right: -100px;
        }
        .orb-b {
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
            bottom: -120px;
            left: -100px;
            animation-delay: -5s;
        }
        .orb-c {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, var(--accent-3), transparent 70%);
            top: 42%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0.18;
            animation-delay: -9s;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(35px, 45px) scale(1.12); }
        }

        #confettiCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Header - strictly only the word اختبار */
        header {
            text-align: center;
            margin-bottom: 34px;
            animation: heroReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header h1 {
            font-size: clamp(2.6rem, 6vw, 3.6rem);
            font-weight: 900;
            letter-spacing: 0.5px;
            display: inline-block;
            padding: 10px 54px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.16), rgba(6, 182, 212, 0.12));
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            background-clip: padding-box;
        }

        header h1 span {
            background: linear-gradient(90deg, #ffffff 0%, #c7d2fe 50%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes heroReveal {
            from { opacity: 0; transform: translateY(-24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Sticky Glass Progress HUD */
        .progress-hud {
            position: sticky;
            top: 16px;
            z-index: 60;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 14px 22px;
            margin-bottom: 30px;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .hud-counter {
            font-weight: 800;
            font-size: 0.98rem;
            color: #e2e8f0;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-2);
            box-shadow: 0 0 12px var(--accent-2);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .progress-track {
            flex: 1;
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 0 16px rgba(6, 182, 212, 0.55);
            transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .hud-pct {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: #67e8f9;
            min-width: 44px;
            text-align: left;
            direction: ltr;
        }

        /* Question Card */
        .question-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px 30px;
            margin-bottom: 24px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(28px);
            transition: opacity 0.55s ease, transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .question-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .question-card::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, rgba(148, 163, 184, 0.25), rgba(148, 163, 184, 0.05));
            transition: background 0.35s ease;
        }

        .question-card.answered::before {
            background: linear-gradient(180deg, var(--accent-1), var(--accent-2));
        }

        .question-card:hover {
            border-color: rgba(148, 163, 184, 0.26);
            box-shadow: 0 22px 48px rgba(0, 0, 0, 0.36);
        }

        .q-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .q-num {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #c7d2fe;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 5px 14px;
            border-radius: 999px;
        }

        .q-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.35);
            transition: all 0.3s ease;
        }

        .question-card.answered .q-status-dot {
            background: var(--accent-2);
            box-shadow: 0 0 10px var(--accent-2);
        }

        .q-ar {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            line-height: 1.7;
        }

        .q-en {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.96rem;
            font-weight: 500;
            color: var(--text-secondary);
            direction: ltr;
            text-align: left;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 12px;
            padding: 11px 16px;
            margin-bottom: 22px;
            line-height: 1.55;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        @media (max-width: 680px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .question-card {
                padding: 22px 18px;
            }
        }

        .option-tile {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 16px;
            background: var(--surface-elevated);
            border: 1.5px solid var(--border-subtle);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            user-select: none;
        }

        .option-tile input[type="radio"] {
            display: none;
        }

        .option-tile:hover {
            background: rgba(51, 65, 85, 0.72);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .opt-letter {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .opt-content {
            flex: 1;
            min-width: 0;
        }

        .opt-ar {
            display: block;
            font-size: 0.98rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 3px;
            line-height: 1.45;
        }

        .opt-en {
            display: block;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.84rem;
            font-weight: 500;
            color: var(--text-muted);
            direction: ltr;
            text-align: left;
            line-height: 1.4;
        }

        /* Selected State (neutral - no hint of right/wrong) */
        .option-tile.selected {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(6, 182, 212, 0.14));
            border-color: var(--accent-1);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.22);
        }

        .option-tile.selected .opt-letter {
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            border-color: transparent;
            color: #ffffff;
            transform: scale(1.06);
        }

        .option-tile.selected .opt-en {
            color: #cbd5e1;
        }

        /* Post-Submit Grading States */
        .option-tile.correct-ans {
            background: var(--success-bg) !important;
            border-color: var(--success) !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.18) !important;
        }
        .option-tile.correct-ans .opt-letter {
            background: var(--success) !important;
            border-color: transparent !important;
            color: #fff !important;
        }

        .option-tile.wrong-ans {
            background: var(--danger-bg) !important;
            border-color: var(--danger) !important;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.16) !important;
        }
        .option-tile.wrong-ans .opt-letter {
            background: var(--danger) !important;
            border-color: transparent !important;
            color: #fff !important;
        }

        /* Submit Area */
        .submit-wrap {
            text-align: center;
            margin-top: 40px;
        }

        .btn-submit {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 1.18rem;
            font-weight: 800;
            color: #ffffff;
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            border: none;
            border-radius: 999px;
            padding: 16px 48px;
            cursor: pointer;
            box-shadow: 0 14px 35px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            overflow: hidden;
        }

        .btn-submit::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 20px 42px rgba(6, 182, 212, 0.45);
        }

        .btn-submit:hover:not(:disabled)::after {
            left: 100%;
        }

        .btn-submit:disabled {
            background: rgba(100, 116, 139, 0.35);
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        .alert-toast {
            display: none;
            margin: 18px auto 0;
            max-width: 560px;
            background: rgba(244, 63, 94, 0.16);
            border: 1px solid rgba(244, 63, 94, 0.45);
            color: #fecdd3;
            padding: 13px 20px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.96rem;
            animation: shake 0.45s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Result Dashboard */
        .result-card {
            display: none;
            background: rgba(17, 24, 39, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 28px;
            padding: 40px 28px;
            margin-bottom: 34px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            animation: popIn 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .ring-wrap {
            position: relative;
            width: 164px;
            height: 164px;
            margin: 0 auto 22px;
        }

        .ring-svg {
            transform: rotate(-90deg);
            width: 164px;
            height: 164px;
        }

        .ring-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 11;
        }

        .ring-progress {
            fill: none;
            stroke: url(#scoreGrad);
            stroke-width: 11;
            stroke-linecap: round;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            transition: stroke-dashoffset 1.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ring-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .score-val {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            color: #ffffff;
        }

        .score-of {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 700;
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin: 22px 0 10px;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 22px;
            min-width: 120px;
        }

        .stat-pill span {
            display: block;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .stat-pill strong {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .stat-correct strong { color: var(--success); }
        .stat-wrong strong { color: var(--danger); }
        .stat-pct strong { color: var(--accent-2); }

        .lock-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: #fcd34d;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .card-error-highlight {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.3) !important;
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="ambient-orb orb-a"></div>
    <div class="ambient-orb orb-b"></div>
    <div class="ambient-orb orb-c"></div>
    <canvas id="confettiCanvas"></canvas>

    <div class="container">
        <header>
            <h1><span>اختبار</span></h1>
        </header>

        <section class="result-card" id="resultCard">
            <div class="ring-wrap">
                <svg class="ring-svg" viewBox="0 0 160 160">
                    <defs>
                        <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#6366f1"/>
                            <stop offset="100%" stop-color="#06b6d4"/>
                        </linearGradient>
                    </defs>
                    <circle class="ring-bg" cx="80" cy="80" r="70"></circle>
                    <circle class="ring-progress" id="ringProgress" cx="80" cy="80" r="70"></circle>
                </svg>
                <div class="ring-center">
                    <span class="score-val" id="scoreVal">0</span>
                    <span class="score-of">من 30</span>
                </div>
            </div>
            <h2 class="result-title" id="resultTitle"></h2>
            <div class="stats-row">
                <div class="stat-pill stat-correct">
                    <span>إجابات صحيحة / Correct</span>
                    <strong id="statCorrect">0</strong>
                </div>
                <div class="stat-pill stat-wrong">
                    <span>إجابات خاطئة / Wrong</span>
                    <strong id="statWrong">0</strong>
                </div>
                <div class="stat-pill stat-pct">
                    <span>النسبة / Score</span>
                    <strong id="statPct">0%</strong>
                </div>
            </div>
            <div class="lock-badge">تم تسليم محاولتك الوحيدة وإغلاق الاختبار — Single Attempt Completed</div>
        </section>

        <div class="progress-hud" id="progressHud">
            <div class="hud-counter">
                <span class="hud-dot"></span>
                <span id="progressText">0 / 30</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="hud-pct" id="progressPct">0%</div>
        </div>

        <form id="quizForm">
            <div id="questionsContainer"></div>

            <div class="submit-wrap" id="submitWrap">
                <button type="submit" class="btn-submit" id="submitBtn">
                    <span>إنهاء الاختبار وعرض النتيجة</span>
                    <span style="opacity:0.85; font-family:'Plus Jakarta Sans',sans-serif; font-size:0.95rem;">/ Submit</span>
                </button>
                <div class="alert-toast" id="alertToast">
                    يرجى الإجابة على جميع الأسئلة قبل التسليم — Please answer all 30 questions before submitting
                </div>
            </div>
        </form>
    </div>

    <script>
        const quizData = [
    {
        "ar": "أي وسم في لغة HTML يُستخدم لإنشاء أكبر عنوان رئيسي في الصفحة؟",
        "en": "Which HTML tag is used to create the largest main heading on a page?",
        "options": [
            {
                "ar": "وسم الفقرة النصية p",
                "en": "The paragraph tag <p>"
            },
            {
                "ar": "وسم النص المضمن span",
                "en": "The inline text tag <span>"
            },
            {
                "ar": "وسم العنوان الرئيسي h1",
                "en": "The main heading tag <h1>"
            },
            {
                "ar": "وسم الحاوية العامة div",
                "en": "The general container tag <div>"
            }
        ],
        "correct": 2
    },
    {
        "ar": "أين يتم كتابة عنوان الصفحة الذي يظهر في شريط تبويب المتصفح؟",
        "en": "Where is the page title that appears in the browser tab written?",
        "options": [
            {
                "ar": "داخل وسم الجدول table",
                "en": "Inside the <table> tag"
            },
            {
                "ar": "داخل وسم العنوان title",
                "en": "Inside the <title> tag"
            },
            {
                "ar": "داخل وسم القائمة ul",
                "en": "Inside the <ul> tag"
            },
            {
                "ar": "داخل وسم الجسم body",
                "en": "Inside the <body> tag"
            }
        ],
        "correct": 1
    },
    {
        "ar": "كيف يمكن تعطيل جزء من كود HTML بحيث يتجاهله المتصفح ولا يعرضه في الصفحة؟",
        "en": "How can a section of HTML code be disabled so the browser ignores it?",
        "options": [
            {
                "ar": "بوضعه داخل وسم الفقرة p",
                "en": "By placing it inside a <p> tag"
            },
            {
                "ar": "بوضعه داخل علامات التعليق",
                "en": "By wrapping it in HTML comments"
            },

        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressPct = document.getElementById('progressPct');
        const progressHud = document.getElementById('progressHud');
        const quizForm = document.getElementById('quizForm');
        const resultCard = document.getElementById('resultCard');
        const scoreVal = document.getElementById('scoreVal');
        const ringProgress = document.getElementById('ringProgress');
        const resultTitle = document.getElementById('resultTitle');

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function renderQuestions() {
            questionsContainer.innerHTML = '';
            quizData.forEach((item, qIndex) => {
                const card = document.createElement('article');
                card.className = 'question-card';
                card.id = `card_${qIndex}`;

                const numFormatted = String(qIndex + 1).padStart(2, '0');
                let optionsHTML = '';

                item.options.forEach((opt, oIndex) => {
                    optionsHTML += `
                        <label class="option-tile" id="tile_${qIndex}_${oIndex}">
                            <input type="radio" name="q_${qIndex}" value="${oIndex}" onchange="handleSelect(${qIndex}, ${oIndex})">
                            <span class="opt-letter">${LETTERS[oIndex]}</span>
                            <span class="opt-content">
                                <span class="opt-ar">${escapeHtml(opt.ar)}</span>
                                <span class="opt-en">${escapeHtml(opt.en)}</span>
                            </span>
                        </label>
                    `;
                });

                card.innerHTML = `
                    <div class="q-top">
                        <span class="q-num">سؤال ${numFormatted} &bull; Q${numFormatted}</span>
                        <span class="q-status-dot"></span>
                    </div>
                    <div class="q-ar">${escapeHtml(item.ar)}</div>
                    <div class="q-en">${escapeHtml(item.en)}</div>
                    <div class="options-grid">
                        ${optionsHTML}
                    </div>
                `;
                questionsContainer.appendChild(card);
            });

            setupScrollReveal();
        }

        function setupScrollReveal() {
            const cards = document.querySelectorAll('.question-card');
            if (!('IntersectionObserver' in window)) {
                cards.forEach(c => c.classList.add('visible'));
                return;
            }
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.08 });
            cards.forEach(card => observer.observe(card));
        }

        window.handleSelect = function(qIndex, oIndex) {
            if (localStorage.getItem(STORAGE_KEY)) return;
            for (let i = 0; i < 4; i++) {
                const tile = document.getElementById(`tile_${qIndex}_${i}`);
                if (tile) tile.classList.remove('selected');
            }
            const chosenTile = document.getElementById(`tile_${qIndex}_${oIndex}`);
            if (chosenTile) chosenTile.classList.add('selected');

            const card = document.getElementById(`card_${qIndex}`);
            if (card) {
                card.classList.add('answered');
                card.classList.remove('card-error-highlight');
            }
            updateProgress();
        };

        function updateProgress() {
            let answered = 0;
            for (let i = 0; i < quizData.length; i++) {
                if (document.querySelector(`input[name="q_${i}"]:checked`)) {
                    answered++;
                }
            }
            const pct = Math.round((answered / quizData.length) * 100);
            progressFill.style.width = `${pct}%`;
            progressText.textContent = `${answered} / ${quizData.length}`;
            progressPct.textContent = `${pct}%`;
            if (answered === quizData.length) {
                alertToast.style.display = 'none';
            }
        }

        function launchConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const colors = ['#6366f1', '#06b6d4', '#10b981', '#f59e0b', '#ec4899'];
            const pieces = Array.from({ length: 110 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * -canvas.height * 0.5,
                r: Math.random() * 6 + 4,
                dx: (Math.random() - 0.5) * 3,
                dy: Math.random() * 3.5 + 2.5,
                color: colors[Math.floor(Math.random() * colors.length)],
                rot: Math.random() * 360,
                drot: (Math.random() - 0.5) * 8
            }));

            let frames = 0;
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * 1.4);
                    ctx.restore();
                    p.x += p.dx;
                    p.y += p.dy;
                    p.rot += p.drot;
                });
                frames++;
                if (frames < 160) requestAnimationFrame(draw);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            draw();
        }

        function showFinalResults(userAnswers, isFreshSubmit = false) {
            let score = 0;
            quizData.forEach((item, qIndex) => {
                const chosen = userAnswers[qIndex];
                const isCorrect = chosen === item.correct;
                if (isCorrect) score++;

                const card = document.getElementById(`card_${qIndex}`);
                if (card) card.classList.add('visible', 'answered');

                for (let oIndex = 0; oIndex < 4; oIndex++) {
                    const tile = document.getElementById(`tile_${qIndex}_${oIndex}`);
                    const inp = tile.querySelector('input');
                    const letterBox = tile.querySelector('.opt-letter');
                    inp.disabled = true;
                    tile.style.cursor = 'default';
                    tile.classList.remove('selected');

                    if (oIndex === item.correct) {
                        tile.classList.add('correct-ans');
                        letterBox.textContent = '✓';
                    } else if (oIndex === chosen && !isCorrect) {
                        tile.classList.add('wrong-ans');
                        letterBox.textContent = '✕';
                    }
                }
            });

            const pct = Math.round((score / quizData.length) * 100);
            scoreVal.textContent = score;
            statCorrect.textContent = score;
            statWrong.textContent = quizData.length - score;
            statPct.textContent = `${pct}%`;

            if (score >= 27) {
                resultTitle.textContent = "أداء استثنائي وممتاز! — Outstanding!";
            } else if (score >= 21) {
                resultTitle.textContent = "جيد جداً! — Very Good!";
            } else if (score >= 15) {
                resultTitle.textContent = "ناجح — Passed";
            } else {
                resultTitle.textContent = "تحتاج إلى مراجعة الدروس — Needs Review";
            }

            resultCard.style.display = 'block';
            progressHud.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>تم تسليم الاختبار / Submitted</span>';

            const circumference = 2 * Math.PI * 70;
            ringProgress.style.strokeDasharray = circumference;
            setTimeout(() => {
                ringProgress.style.strokeDashoffset = circumference - (pct / 100) * circumference;
            }, 120);

            if (isFreshSubmit && pct >= 70) {
                launchConfetti();
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        quizForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if (localStorage.getItem(STORAGE_KEY)) return;

            const userAnswers = [];
            for (let i = 0; i < quizData.length; i++) {
                const checked = document.querySelector(`input[name="q_${i}"]:checked`);
                if (!checked) {
                    alertToast.style.display = 'block';
                    const card = document.getElementById(`card_${i}`);
                    card.classList.add('visible', 'card-error-highlight');
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    setTimeout(() => card.classList.remove('card-error-highlight'), 2400);
                    return;
                }
                userAnswers.push(parseInt(checked.value, 10));
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                submitted: true,
                answers: userAnswers,
                timestamp: Date.now()
            }));

            showFinalResults(userAnswers, true);
        });

        // Initialize
        renderQuestions();
        const savedAttempt = localStorage.getItem(STORAGE_KEY);
        if (savedAttempt) {
            try {
                const parsed = JSON.parse(savedAttempt);
                if (parsed && parsed.submitted && Array.isArray(parsed.answers)) {
                    parsed.answers.forEach((ans, idx) => {
                        const radio = document.querySelector(`input[name="q_${idx}"][value="${ans}"]`);
                        if (radio) radio.checked = true;
                    });
                    showFinalResults(parsed.answers, false);
                }
            } catch (err) {
                console.error(err);
            }
        }
    </script>
</body>
</html>
